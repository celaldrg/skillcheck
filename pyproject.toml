[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcheck"
version = "0.1.0"
description = "Lint Agent Skills (SKILL.md folders) before an agent loads them"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Celalettin Durğaç"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["agent-skills", "skill-md", "claude-code", "codex", "cursor", "lint", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/celaldrg/skillcheck"

[project.scripts]
skillcheck = "skillcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
